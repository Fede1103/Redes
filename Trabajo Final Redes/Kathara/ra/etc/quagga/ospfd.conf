hostname ra
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LA (192.168.100.0/29)
interface eth0
 ip ospf cost 10
!
! eth1 - EA_BC hacia RBC (192.168.200.0/30)
interface eth1
 ip ospf cost 20
!
! eth2 - EA_DE hacia RDE (192.168.200.4/30)
interface eth2
 ip ospf cost 25
!
router ospf
 ospf router-id 192.168.100.6
 passive-interface eth0
 network 192.168.100.0/29 area 0
 network 192.168.200.0/30 area 0
 network 192.168.200.4/30 area 0
 default-information originate
!
log file /var/log/quagga/ospfd.log
