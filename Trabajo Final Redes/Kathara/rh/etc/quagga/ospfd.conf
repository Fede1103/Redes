hostname rh
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LH (192.168.10.0/25)
interface eth0
 ip ospf cost 10
!
! eth1 - EDE_H hacia RDE (192.168.200.20/30)
interface eth1
 ip ospf cost 38
!
! eth2 - EH_I hacia RI (192.168.200.32/30)
interface eth2
 ip ospf cost 32
!
router ospf
 ospf router-id 192.168.10.126
 passive-interface eth0
 network 192.168.10.0/25 area 0
 network 192.168.200.20/30 area 0
 network 192.168.200.32/30 area 0
!
log file /var/log/quagga/ospfd.log
