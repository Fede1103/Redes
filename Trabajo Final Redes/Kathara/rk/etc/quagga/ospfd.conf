hostname rk
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LK (192.168.60.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EBC_K hacia RBC (192.168.200.16/30)
interface eth1
 ip ospf cost 21
!
! eth2 - EDE_K hacia RDE (192.168.200.24/30)
interface eth2
 ip ospf cost 26
!
! eth3 - EK_N hacia RN (192.168.200.44/30)
interface eth3
 ip ospf cost 45
!
! eth4 - EK_O hacia RO (192.168.200.48/30)
interface eth4
 ip ospf cost 22
!
router ospf
 ospf router-id 192.168.60.254
 passive-interface eth0
 network 192.168.60.0/24 area 0
 network 192.168.200.16/30 area 0
 network 192.168.200.24/30 area 0
 network 192.168.200.44/30 area 0
 network 192.168.200.48/30 area 0
!
log file /var/log/quagga/ospfd.log
