hostname ro
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LO (172.16.6.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EK_O hacia RK (192.168.200.48/30)
interface eth1
 ip ospf cost 34
!
! eth2 - EO_P hacia RP (192.168.200.60/30)
interface eth2
 ip ospf cost 26
!
! eth3 - EO_T hacia RT (192.168.200.64/30)
interface eth3
 ip ospf cost 29
!
router ospf
 ospf router-id 172.16.6.254
 passive-interface eth0
 network 172.16.6.0/24 area 0
 network 192.168.200.48/30 area 0
 network 192.168.200.60/30 area 0
 network 192.168.200.64/30 area 0
!
log file /var/log/quagga/ospfd.log
