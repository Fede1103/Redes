hostname rs
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LS (192.168.70.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - ES_T hacia RT (192.168.200.72/30)
interface eth1
 ip ospf cost 37
!
! eth2 - ES_V hacia RV (192.168.200.76/30)
interface eth2
 ip ospf cost 43
!
router ospf
 ospf router-id 192.168.70.254
 passive-interface eth0
 network 192.168.70.0/24 area 0
 network 192.168.200.72/30 area 0
 network 192.168.200.76/30 area 0
!
log file /var/log/quagga/ospfd.log
