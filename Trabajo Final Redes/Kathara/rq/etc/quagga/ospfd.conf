hostname rq
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LQ (192.168.50.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EL_Q hacia RL (192.168.200.52/30)
interface eth1
 ip ospf cost 55
!
! eth2 - EP_Q hacia RP (192.168.200.68/30)
interface eth2
 ip ospf cost 47
!
router ospf
 ospf router-id 192.168.50.254
 passive-interface eth0
 network 192.168.50.0/24 area 0
 network 192.168.200.52/30 area 0
 network 192.168.200.68/30 area 0
!
log file /var/log/quagga/ospfd.log
