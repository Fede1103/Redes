hostname rf
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LF (172.16.0.0/23)
interface eth0
 ip ospf cost 10
!
! eth1 - EBC_F hacia RBC (192.168.200.8/30)
interface eth1
 ip ospf cost 22
!
router ospf
 ospf router-id 172.16.1.254
 passive-interface eth0
 network 172.16.0.0/23 area 0
 network 192.168.200.8/30 area 0
!
log file /var/log/quagga/ospfd.log
