hostname rn
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LN (172.16.5.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EK_N hacia RK (192.168.200.44/30)
interface eth1
 ip ospf cost 29
!
router ospf
 ospf router-id 172.16.5.254
 passive-interface eth0
 network 172.16.5.0/24 area 0
 network 192.168.200.44/30 area 0
!
log file /var/log/quagga/ospfd.log
