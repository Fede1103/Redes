hostname rt
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LT (192.168.80.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EO_T hacia RO (192.168.200.64/30)
interface eth1
 ip ospf cost 52
!
! eth2 - ES_T hacia RS (192.168.200.72/30)
interface eth2
 ip ospf cost 20
!
! eth3 - ET_U hacia RU (192.168.200.80/30)
interface eth3
 ip ospf cost 25
!
router ospf
 ospf router-id 192.168.80.254
 passive-interface eth0
 network 192.168.80.0/24 area 0
 network 192.168.200.64/30 area 0
 network 192.168.200.72/30 area 0
 network 192.168.200.80/30 area 0
!
log file /var/log/quagga/ospfd.log
