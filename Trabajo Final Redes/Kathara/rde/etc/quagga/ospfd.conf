hostname rde
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LD (10.3.0.0/19)
interface eth0
 ip ospf cost 10
!
! eth1 - LE (10.4.0.0/21)
interface eth1
 ip ospf cost 10
!
! eth2 - EA_DE hacia RA (192.168.200.4/30)
interface eth2
 ip ospf cost 35
!
! eth3 - EDE_H hacia RH (192.168.200.20/30)
interface eth3
 ip ospf cost 24
!
! eth4 - EDE_K hacia RK (192.168.200.24/30)
interface eth4
 ip ospf cost 33
!
router ospf
 ospf router-id 10.3.31.254
 passive-interface eth0
 passive-interface eth1
 network 10.3.0.0/19 area 0
 network 10.4.0.0/21 area 0
 network 192.168.200.4/30 area 0
 network 192.168.200.20/30 area 0
 network 192.168.200.24/30 area 0
!
log file /var/log/quagga/ospfd.log
