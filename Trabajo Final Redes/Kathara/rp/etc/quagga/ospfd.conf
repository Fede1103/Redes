hostname rp
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LP (172.16.7.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EO_P hacia RO (192.168.200.60/30)
interface eth1
 ip ospf cost 39
!
! eth2 - EP_Q hacia RQ (192.168.200.68/30)
interface eth2
 ip ospf cost 21
!
router ospf
 ospf router-id 172.16.7.254
 passive-interface eth0
 network 172.16.7.0/24 area 0
 network 192.168.200.60/30 area 0
 network 192.168.200.68/30 area 0
!
log file /var/log/quagga/ospfd.log
