hostname rbc
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LB (10.0.0.0/15)
interface eth0
 ip ospf cost 10
!
! eth1 - LC (10.2.0.0/18)
interface eth1
 ip ospf cost 10
!
! eth2 - EA_BC hacia RA (192.168.200.0/30)
interface eth2
 ip ospf cost 30
!
! eth3 - EBC_F hacia RF (192.168.200.8/30)
interface eth3
 ip ospf cost 40
!
! eth4 - EBC_G hacia RG (192.168.200.12/30)
interface eth4
 ip ospf cost 30
!
! eth5 - EBC_K hacia RK (192.168.200.16/30)
interface eth5
 ip ospf cost 35
!
router ospf
 ospf router-id 10.1.255.254
 passive-interface eth0
 passive-interface eth1
 network 10.0.0.0/15 area 0
 network 10.2.0.0/18 area 0
 network 192.168.200.0/30 area 0
 network 192.168.200.8/30 area 0
 network 192.168.200.12/30 area 0
 network 192.168.200.16/30 area 0
!
log file /var/log/quagga/ospfd.log
