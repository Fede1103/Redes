hostname rr
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LR (192.168.40.0/28)
interface eth0
 ip ospf cost 10
!
! eth1 - EM_R hacia RM (192.168.200.56/30)
interface eth1
 ip ospf cost 44
!
router ospf
 ospf router-id 192.168.40.14
 passive-interface eth0
 network 192.168.40.0/28 area 0
 network 192.168.200.56/30 area 0
!
log file /var/log/quagga/ospfd.log
