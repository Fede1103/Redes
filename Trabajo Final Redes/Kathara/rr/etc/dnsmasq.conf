# DHCP de la LAN LR (192.168.40.0/28)
port=0
interface=eth0
bind-interfaces
dhcp-authoritative
user=root

# Pool dinamico para HR3, HR4 y HR5 - lease de 5 minutos
dhcp-range=192.168.40.3,192.168.40.5,255.255.255.240,5m

# Opciones: 3 = gateway, 6 = DNS, 15 = dominio, 119 = dominio de busqueda
dhcp-option=option:router,192.168.40.14
dhcp-option=option:dns-server,192.168.100.1
dhcp-option=option:domain-name,petas.izo
dhcp-option=option:domain-search,petas.izo

# IP fija por reserva de MAC (la MAC se fija en lab.conf)
dhcp-host=02:00:00:00:40:01,hr1,192.168.40.1,5m
dhcp-host=02:00:00:00:40:02,hr2,192.168.40.2,5m

dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
log-facility=/var/log/dnsmasq.log
