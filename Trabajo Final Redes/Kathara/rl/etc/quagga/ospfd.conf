hostname rl
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LL (172.16.3.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EI_L hacia RI (192.168.200.36/30)
interface eth1
 ip ospf cost 41
!
! eth2 - EL_Q hacia RQ (192.168.200.52/30)
interface eth2
 ip ospf cost 60
!
router ospf
 ospf router-id 172.16.3.254
 passive-interface eth0
 network 172.16.3.0/24 area 0
 network 192.168.200.36/30 area 0
 network 192.168.200.52/30 area 0
!
log file /var/log/quagga/ospfd.log
