hostname rj
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LJ (192.168.30.0/30)
interface eth0
 ip ospf cost 10
!
! eth1 - EG_J hacia RG (192.168.200.28/30)
interface eth1
 ip ospf cost 50
!
! eth2 - EJ_M hacia RM (192.168.200.40/30)
interface eth2
 ip ospf cost 36
!
router ospf
 ospf router-id 192.168.30.2
 passive-interface eth0
 network 192.168.30.0/30 area 0
 network 192.168.200.28/30 area 0
 network 192.168.200.40/30 area 0
!
log file /var/log/quagga/ospfd.log
