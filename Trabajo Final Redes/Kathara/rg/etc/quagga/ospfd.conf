hostname rg
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LG (172.16.2.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EBC_G hacia RBC (192.168.200.12/30)
interface eth1
 ip ospf cost 45
!
! eth2 - EG_J hacia RJ (192.168.200.28/30)
interface eth2
 ip ospf cost 28
!
router ospf
 ospf router-id 172.16.2.254
 passive-interface eth0
 network 172.16.2.0/24 area 0
 network 192.168.200.12/30 area 0
 network 192.168.200.28/30 area 0
!
log file /var/log/quagga/ospfd.log
