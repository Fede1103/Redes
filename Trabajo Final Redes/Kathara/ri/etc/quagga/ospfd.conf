hostname ri
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LI (192.168.20.0/29)
interface eth0
 ip ospf cost 10
!
! eth1 - EH_I hacia RH (192.168.200.32/30)
interface eth1
 ip ospf cost 48
!
! eth2 - EI_L hacia RL (192.168.200.36/30)
interface eth2
 ip ospf cost 27
!
router ospf
 ospf router-id 192.168.20.6
 passive-interface eth0
 network 192.168.20.0/29 area 0
 network 192.168.200.32/30 area 0
 network 192.168.200.36/30 area 0
!
log file /var/log/quagga/ospfd.log
