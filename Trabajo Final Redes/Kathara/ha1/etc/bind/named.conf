options {
    directory "/var/cache/bind";
    allow-query { any; };
    listen-on { any; };

    recursion yes;
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    dnssec-validation no;
};

# Zona directa de la empresa
zone "petas.izo" {
    type master;
    file "/etc/bind/db.petas.izo";
};

# Zonas inversas
zone "10.in-addr.arpa" {
    type master;
    file "/etc/bind/db.10";
};

zone "16.172.in-addr.arpa" {
    type master;
    file "/etc/bind/db.172.16";
};

zone "168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/db.192.168";
};

include "/etc/bind/named.conf.default-zones";
