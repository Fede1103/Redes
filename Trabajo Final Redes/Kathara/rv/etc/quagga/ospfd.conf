hostname rv
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LV (192.168.110.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - ES_V hacia RS (192.168.200.76/30)
interface eth1
 ip ospf cost 28
!
! eth2 - EU_V hacia RU (192.168.200.84/30)
interface eth2
 ip ospf cost 58
!
router ospf
 ospf router-id 192.168.110.254
 passive-interface eth0
 network 192.168.110.0/24 area 0
 network 192.168.200.76/30 area 0
 network 192.168.200.84/30 area 0
!
log file /var/log/quagga/ospfd.log
