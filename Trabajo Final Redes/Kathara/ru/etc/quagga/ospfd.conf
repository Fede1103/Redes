hostname ru
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LU (192.168.90.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - ET_U hacia RT (192.168.200.80/30)
interface eth1
 ip ospf cost 49
!
! eth2 - EU_V hacia RV (192.168.200.84/30)
interface eth2
 ip ospf cost 34
!
router ospf
 ospf router-id 192.168.90.254
 passive-interface eth0
 network 192.168.90.0/24 area 0
 network 192.168.200.80/30 area 0
 network 192.168.200.84/30 area 0
!
log file /var/log/quagga/ospfd.log
