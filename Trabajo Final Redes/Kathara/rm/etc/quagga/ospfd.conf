hostname rm
password zebra
enable password zebra
!
! Costo OSPF de SALIDA de cada interfaz (metrica de ese sentido)
!
! eth0 - LM (172.16.4.0/24)
interface eth0
 ip ospf cost 10
!
! eth1 - EJ_M hacia RJ (192.168.200.40/30)
interface eth1
 ip ospf cost 23
!
! eth2 - EM_R hacia RR (192.168.200.56/30)
interface eth2
 ip ospf cost 31
!
router ospf
 ospf router-id 172.16.4.254
 passive-interface eth0
 network 172.16.4.0/24 area 0
 network 192.168.200.40/30 area 0
 network 192.168.200.56/30 area 0
!
log file /var/log/quagga/ospfd.log
